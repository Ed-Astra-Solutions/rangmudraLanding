# Builds the pre-rendered site (tools/build-static.mjs) from the live API and
# publishes it to GitHub Pages. Runs on every push to main, and on demand:
# Actions tab → "Publish site" → Run workflow, or
#   gh workflow run publish.yml -R Ed-Astra-Solutions/rangmudraLanding
# Run it after changing products, workshops, posts or page copy in the admin
# so the HTML search engines read matches the admin.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build tool
        working-directory: tools
        run: npm ci
      - name: Build pages from the live API
        working-directory: tools
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node build-static.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
