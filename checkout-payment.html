<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — Rangmudra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Archivo:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="checkout-page" data-step="3">

  <div data-partial="header"></div>

  <div class="breadcrumb-wrap"><nav data-breadcrumb></nav></div>

  <div class="checkout-grid container">

    <!-- Left column: order summary review -->
    <div style="padding-top:0;">
      <h2 class="h2-i color-sc-100" style="margin-bottom:8px;">Review &amp; Pay</h2>
      <div style="width:60%;height:1px;background:rgba(44,26,16,0.12);margin-bottom:32px;"></div>
      <p class="h5-a color-sc-l3">Please review your order before completing payment.</p>

      <div style="margin-top:32px;background:var(--w1);border-radius:16px;padding:32px;" id="order-summary-card">
        <h3 class="h4-i color-sc-100" style="margin-bottom:24px;">Order Summary</h3>
        <div id="order-items-preview" style="display:flex;flex-direction:column;gap:16px;"></div>
        <div style="border-top:1px solid rgba(44,26,16,0.12);margin-top:24px;padding-top:24px;">
          <div class="cart-summary-row"><span class="h5-a">Subtotal</span><span class="h5-a" id="review-subtotal">₹0</span></div>
          <div class="cart-summary-row"><span class="h5-a">Tax (8%)</span><span class="h5-a" id="review-tax">₹0</span></div>
          <div class="cart-summary-row"><span class="h5-a">Delivery</span><span class="h5-a">₹99</span></div>
          <div class="cart-summary-row" id="review-discount-row" style="display:none;"><span class="h5-a" id="review-discount-label">Discount</span><span class="h5-a" id="review-discount">-₹0</span></div>
          <div class="cart-total-row"><span class="cart-total-label">Total</span><span class="cart-total-value" id="review-total">₹0</span></div>
        </div>
      </div>
    </div>

    <!-- Right: Sidebar with payment methods -->
    <aside class="checkout-sidebar" aria-label="Payment">

      <!-- Stepper -->
      <div class="stepper" aria-label="Checkout progress">
        <div class="stepper__step">
          <div class="stepper__circle" aria-label="Step 1: Cart">1</div>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step">
          <div class="stepper__circle" aria-label="Step 2: Delivery Address">2</div>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step active" aria-current="step">
          <div class="stepper__circle" aria-label="Step 3: Payment (current)">3</div>
        </div>
      </div>

      <h2 class="h2-i color-sc-100" style="margin-bottom:32px;">Payment</h2>

      <!-- Razorpay (single payment option) -->
      <div style="margin-bottom:48px;">
        <p class="h4-a color-sc-100" style="text-transform:uppercase;margin-bottom:16px;">Pay Securely</p>
        <div class="payment-row payment-row--razorpay" aria-label="Pay securely with Razorpay" style="cursor:default;">
          <div class="payment-row__logo" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--pr-b2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </div>
          <span class="payment-row__label h5-a">Razorpay</span>
          <svg class="payment-row__chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <p class="h6-a color-sc-l3" style="margin-top:12px;">UPI, Cards, Net Banking &amp; Wallets — handled securely by Razorpay. Tap Proceed to pay.</p>
      </div>

      <button class="btn-proceed" id="proceed-btn">Proceed</button>
      <a href="checkout-address.html" class="btn-back" style="display:flex;margin-top:12px;text-decoration:none;align-items:center;justify-content:center;">Back</a>

    </aside>
  </div>

  <div data-partial="footer"></div>
  <div data-partial="auth-modal"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module">
    import { getCart, getCartTotal, clearCart } from '/js/cart.js';
    import { isLoggedIn, getToken, openAuthModal, getUserAddresses } from '/js/auth.js';
    import { apiUrl } from '/js/config.js';

    const DELIVERY_FEE = 99;
    const TAX_RATE = 0.08;
    const COUPON_KEY = 'rangmudra_coupon';

    function formatPrice(n) {
      return '₹' + Math.round(n).toLocaleString('en-IN');
    }

    // Re-check any applied coupon against the current cart for the summary preview.
    // The authoritative discount is recomputed by create-order before charging.
    async function getCouponDiscount(subtotal) {
      const code = localStorage.getItem(COUPON_KEY);
      if (!code || subtotal <= 0) return { code: null, discount: 0 };
      try {
        const res = await fetch(apiUrl('/api/checkout/apply-coupon'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, subtotal }),
        });
        if (!res.ok) { localStorage.removeItem(COUPON_KEY); return { code: null, discount: 0 }; }
        const data = await res.json();
        return { code, discount: data.discount || 0 };
      } catch {
        return { code, discount: 0 };
      }
    }

    async function renderOrderSummary() {
      const cart = getCart();
      const subtotal = getCartTotal();
      const { code, discount } = await getCouponDiscount(subtotal);
      const discountedSubtotal = Math.max(0, subtotal - discount);
      const tax = Math.round(discountedSubtotal * TAX_RATE);
      const total = discountedSubtotal + tax + DELIVERY_FEE;

      const discRow = document.getElementById('review-discount-row');
      const discEl = document.getElementById('review-discount');
      const discLabel = document.getElementById('review-discount-label');
      if (discount > 0) {
        if (discLabel) discLabel.textContent = `Discount${code ? ` (${code})` : ''}`;
        if (discEl) discEl.textContent = '-' + formatPrice(discount);
        if (discRow) discRow.style.display = '';
      } else if (discRow) {
        discRow.style.display = 'none';
      }

      const preview = document.getElementById('order-items-preview');
      if (preview) {
        preview.innerHTML = cart.map(item => `
          <div style="display:flex;gap:16px;align-items:center;">
            <img src="${item.image || '/images/uploads/prod-ajrakh-corset-1.jpg'}" alt="${item.name}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;" loading="lazy" width="60" height="60">
            <div style="flex:1;">
              <p class="h5-a color-sc-100">${item.name}</p>
              <p class="h6-a color-sc-l3" style="text-transform:uppercase;">Size: ${item.size}</p>
            </div>
            <p class="h5-a color-sc-100">${formatPrice(item.price)}</p>
          </div>
        `).join('');
      }

      const s = document.getElementById('review-subtotal');
      const t = document.getElementById('review-tax');
      const tot = document.getElementById('review-total');
      if (s) s.textContent = formatPrice(subtotal);
      if (t) t.textContent = formatPrice(tax);
      if (tot) tot.textContent = formatPrice(total);
    }

    async function resolveDeliveryAddress() {
      const id = localStorage.getItem('rangmudra_delivery_address');
      if (!id) return null;
      try {
        const addresses = await getUserAddresses();
        return addresses.find(a => a.id === id) || null;
      } catch {
        return null;
      }
    }

    const proceedBtn = document.getElementById('proceed-btn');

    proceedBtn?.addEventListener('click', async () => {
      const cart = getCart();
      if (!cart.length) {
        alert('Your cart is empty.');
        window.location.href = 'shop.html';
        return;
      }

      if (!isLoggedIn()) {
        openAuthModal(() => proceedBtn.click());
        return;
      }

      proceedBtn.disabled = true;
      const originalLabel = proceedBtn.textContent;
      proceedBtn.textContent = 'Starting payment…';

      try {
        const address = await resolveDeliveryAddress();
        if (!address) {
          alert('Please choose a delivery address before paying.');
          window.location.href = 'checkout-address.html';
          return;
        }
        const token = getToken();

        const orderRes = await fetch(apiUrl('/api/checkout/create-order'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-user-token': token },
          body: JSON.stringify({
            items: cart.map(i => ({ id: i.id, name: i.name, size: i.size, qty: i.qty || 1, price: i.price })),
            address,
            couponCode: localStorage.getItem(COUPON_KEY) || undefined,
          }),
        });
        const order = await orderRes.json().catch(() => ({}));

        if (!orderRes.ok) {
          alert(order.error || 'Could not start payment. Please try again.');
          return;
        }

        const rzp = new Razorpay({
          key: order.keyId,
          amount: order.amount,
          currency: order.currency,
          name: 'Rangmudra',
          description: 'Colour of the Hand',
          order_id: order.orderId,
          handler: async (response) => {
            try {
              const verifyRes = await fetch(apiUrl('/api/checkout/verify-payment'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-user-token': token },
                body: JSON.stringify(response),
              });
              if (verifyRes.ok) {
                clearCart();
                localStorage.removeItem(COUPON_KEY);
                window.location.href = `order-confirmation.html?order=${encodeURIComponent(order.receipt)}`;
              } else {
                const v = await verifyRes.json().catch(() => ({}));
                alert(v.error || 'We could not verify your payment. If you were charged, please contact us.');
              }
            } catch {
              alert('We could not verify your payment. If you were charged, please contact us.');
            }
          },
          theme: { color: '#7C684F' },
          modal: {
            ondismiss: () => {
              proceedBtn.disabled = false;
              proceedBtn.textContent = originalLabel;
            },
          },
        });
        rzp.on('payment.failed', (resp) => {
          alert('Payment failed: ' + (resp.error?.description || 'please try again.'));
        });
        rzp.open();
      } catch (err) {
        alert('Something went wrong starting payment. Please try again.');
      } finally {
        proceedBtn.disabled = false;
        proceedBtn.textContent = originalLabel;
      }
    });

    document.addEventListener('DOMContentLoaded', renderOrderSummary);
  </script>
</body>
</html>
