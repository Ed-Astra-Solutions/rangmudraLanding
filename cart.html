<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart — Rangmudra</title>
  <meta name="description" content="Review the hand block-printed pieces in your Rangmudra cart and proceed to checkout.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo/rangmudra-logo-32.png" sizes="32x32">
  <link rel="icon" href="/images/logo/rangmudra-logo-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/images/logo/rangmudra-logo-180.png">
  <link rel="preload" href="/fonts/maiandra-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="checkout-page" data-step="1">

  <div data-partial="header"></div>

  <div class="breadcrumb-wrap"><nav data-breadcrumb></nav></div>

  <div class="checkout-grid container">

    <!-- Left column -->
    <div class="checkout-main" style="padding-top:0;">
      <div style="display:flex;align-items:baseline;gap:32px;margin-bottom:8px;">
        <h1 class="h2-i color-sc-100">My Cart</h1>
      </div>
      <div style="width:60%;height:1px;background:rgba(44,26,16,0.12);margin-bottom:16px;"></div>
      <p class="h5-a color-sc-l3" id="cart-item-count">Loading cart...</p>

      <div style="display:flex;flex-direction:column;gap:16px;margin-top:32px;" id="cart-items-list" aria-label="Cart items">
        <!-- Populated by JS -->
      </div>

      <div style="margin-top:32px;">
        <a href="shop.html" class="h6-a" style="color:var(--pr-b2);text-decoration:underline;letter-spacing:0.15em;text-transform:uppercase;">
          ← Continue Shopping
        </a>
      </div>
    </div>

    <!-- Right: Sidebar -->
    <aside class="checkout-sidebar" aria-label="Order summary">

      <!-- Stepper -->
      <div class="stepper" aria-label="Checkout progress">
        <div class="stepper__step active" aria-current="step">
          <div class="stepper__circle" aria-label="Step 1: Cart">1</div>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step">
          <div class="stepper__circle" aria-label="Step 2: Delivery Address">2</div>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step">
          <div class="stepper__circle" aria-label="Step 3: Payment">3</div>
        </div>
      </div>

      <h2 class="h2-i color-sc-100" style="margin-bottom:32px;">My Cart</h2>

      <!-- Summary rows -->
      <div class="cart-summary-row">
        <span class="h5-a">Total</span>
        <span class="h5-a" id="summary-total">₹0</span>
      </div>
      <div class="cart-summary-row">
        <span class="h5-a">Tax <span class="h7-a" style="vertical-align:middle;" id="summary-tax-rate">. 8%</span></span>
        <span class="h5-a" id="summary-tax">₹0</span>
      </div>
      <div class="cart-summary-row">
        <span class="h5-a">Delivery fee</span>
        <span class="h5-a" id="summary-delivery">—</span>
      </div>
      <p class="h7-a color-sc-l3" id="summary-delivery-note" style="margin:-8px 0 0;" aria-live="polite"></p>

      <!-- Coupon -->
      <div class="coupon-input" style="margin:24px 0;" role="group" aria-label="Coupon code">
        <div class="coupon-input__label" aria-hidden="true">Coupon code</div>
        <input type="text" class="coupon-input__field" id="coupon-input" placeholder="Enter code" aria-label="Enter coupon code" autocomplete="off">
        <button type="button" class="coupon-input__apply" id="coupon-apply">Apply</button>
      </div>
      <p class="h7-a" id="coupon-feedback" style="margin:-16px 0 16px;display:none;" aria-live="polite"></p>

      <div class="cart-summary-row">
        <span class="h5-a" id="summary-discount-label">Discount</span>
        <span class="h5-a" id="summary-discount">-₹0</span>
      </div>

      <div class="cart-total-row">
        <span class="cart-total-label">Amount to be paid</span>
        <span class="cart-total-value" id="summary-amount">₹0</span>
      </div>

      <p class="h6-a cart-stock-note" id="stock-note" role="status" hidden></p>
      <button class="btn-proceed" id="proceed-btn">Proceed</button>
      <button class="btn-back" style="margin-top:12px;" onclick="history.back()">Back</button>

    </aside>
  </div>

  <!-- Mobile sticky summary bar -->
  <div class="mobile-cta-bar" style="justify-content:space-between;" aria-live="polite">
    <div>
      <p class="h7-a color-sc-l3" style="text-transform:uppercase;">Amount to be paid</p>
      <p class="h3-i color-sc-100" id="mobile-amount">₹0</p>
    </div>
    <button class="btn-primary" id="mobile-proceed-btn">Proceed</button>
  </div>

  <div data-partial="footer"></div>
  <div data-partial="auth-modal"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module">
    import { getCart, removeFromCart } from '/js/cart.js';
    import { apiUrl } from '/js/config.js';
    import { getSale, isSaleLive, itemPriceHTML, effectivePrice } from '/js/sale.js';
    import { computeCartTax, taxPercentFor } from '/js/tax.js';
    import { getProducts } from '/js/data.js';
    import { quoteDelivery, addressPincode, deliveryNote } from '/js/shipping.js';

    // Delivery is priced by India Post Speed Post from the studio's PIN to the
    // shopper's, so it is only knowable once we have a destination. Until then
    // DELIVERY_FEE stays null: the summary shows no figure and the total is the
    // items alone. Inventing a placeholder fee here would only mean quoting a
    // number we then have to change at the address step.
    let DELIVERY_FEE = null;
    let DELIVERY_QUOTE = null;
    const COUPON_KEY = 'rangmudra_coupon';

    // The currently applied coupon: { code, discount } or null. The discount is
    // re-validated server-side at checkout, so this is a preview only.
    let appliedCoupon = null;
    // The live store-wide sale (or an inactive placeholder). Loaded on init.
    let SALE = { live: false, percent: 0 };

    function formatPrice(n) {
      return '₹' + Math.round(n).toLocaleString('en-IN');
    }

    // The rupee discount the store-wide sale applies to a subtotal — mirrors the
    // server's computeSaleDiscount so this preview matches what we actually charge.
    function saleDiscountFor(subtotal) {
      if (!isSaleLive(SALE)) return 0;
      let d = Math.round((subtotal * SALE.percent) / 100);
      if (SALE.maxDiscount != null) d = Math.min(d, SALE.maxDiscount);
      return Math.max(0, Math.min(d, subtotal));
    }

    // Break the cart into the numbers the server uses. Per-product discounts are
    // netted into `serverSubtotal`; only items WITHOUT their own discount are
    // eligible for the store-wide sale (a product discount takes priority).
    const NO_SALE = { live: false, percent: 0 };
    function cartSubtotals() {
      const cart = getCart();
      let listSubtotal = 0, serverSubtotal = 0, saleEligible = 0;
      cart.forEach((item) => {
        const qty = item.qty || 1;
        const list = Number(item.price) || 0;
        const productUnit = effectivePrice(item, NO_SALE); // product discount only
        listSubtotal += list * qty;
        serverSubtotal += productUnit * qty;
        if (productUnit >= list) saleEligible += list * qty; // no own discount
      });
      return {
        listSubtotal,
        serverSubtotal,
        productDiscount: listSubtotal - serverSubtotal,
        saleEligible,
      };
    }

    function updateSummary() {
      const sub = cartSubtotals();
      // Store-wide sale only touches items without their own discount; a coupon
      // is checked against the product-discounted subtotal. Best promo wins —
      // the sale and a coupon never stack. Sale takes ties.
      const saleDiscount = saleDiscountFor(sub.saleEligible);
      const couponDiscount = appliedCoupon ? appliedCoupon.discount : 0;
      const saleWins = saleDiscount >= couponDiscount;
      const promoDiscount = Math.max(saleDiscount, couponDiscount);
      // Per-product discounts + the winning promo (product discounts never
      // compete with promos — they apply to different items / order-wide).
      const discount = sub.productDiscount + promoDiscount;

      // Mirror the server: each line is taxed at its product's own rate, on
      // its share of the subtotal after the promo discount.
      const discountedSubtotal = Math.max(0, sub.listSubtotal - discount);
      const tax = computeCartTax(getCart(), promoDiscount);
      const total = discountedSubtotal + tax + (DELIVERY_FEE || 0);

      let label = 'Discount';
      if (promoDiscount > 0 && sub.productDiscount > 0) {
        label = 'Discounts';
      } else if (promoDiscount > 0) {
        label = saleWins
          ? `${SALE.label ? SALE.label : 'Store Sale'} (${SALE.percent}% off)`
          : `Coupon (${appliedCoupon.code})`;
      } else if (sub.productDiscount > 0) {
        label = 'Product discounts';
      }

      document.getElementById('summary-discount-label').textContent = label;
      document.getElementById('summary-total').textContent = formatPrice(sub.listSubtotal);
      document.getElementById('summary-tax').textContent = formatPrice(tax);
      // The rate is only nameable when every line shares one.
      const rateEl = document.getElementById('summary-tax-rate');
      if (rateEl) {
        const rates = [...new Set(getCart().map(taxPercentFor))];
        rateEl.textContent = rates.length === 1 ? `. ${+rates[0].toFixed(2)}%` : '';
      }
      // An em dash, not a figure, until we know where the parcel is going.
      document.getElementById('summary-delivery').textContent =
        DELIVERY_FEE === null ? '—' : formatPrice(DELIVERY_FEE);
      const deliveryNoteEl = document.getElementById('summary-delivery-note');
      // Nothing to explain about the delivery of an empty cart.
      if (deliveryNoteEl) deliveryNoteEl.textContent = getCart().length ? deliveryNote(DELIVERY_QUOTE) : '';
      document.getElementById('summary-discount').textContent = '-' + formatPrice(discount);
      document.getElementById('summary-amount').textContent = formatPrice(total);
      const mobileAmt = document.getElementById('mobile-amount');
      if (mobileAmt) mobileAmt.textContent = formatPrice(total);
    }

    function setCouponFeedback(msg, ok) {
      const el = document.getElementById('coupon-feedback');
      if (!el) return;
      el.textContent = msg || '';
      el.style.display = msg ? 'block' : 'none';
      el.style.color = ok ? 'var(--sc-l3)' : '#B44';
    }

    function clearCoupon(silent) {
      appliedCoupon = null;
      localStorage.removeItem(COUPON_KEY);
      if (!silent) setCouponFeedback('', true);
      updateSummary();
    }

    // Validate a code against the current subtotal and apply it (or surface an
    // error). Empty input just clears any applied coupon.
    async function applyCoupon(code) {
      const trimmed = (code || '').trim().toUpperCase();
      if (!trimmed) { clearCoupon(); return; }
      // Validate against the product-discounted subtotal — matches what the
      // server uses when it recomputes the coupon at checkout.
      const subtotal = cartSubtotals().serverSubtotal;
      if (subtotal <= 0) { setCouponFeedback('Add items to your cart first', false); return; }
      try {
        const res = await fetch(apiUrl('/api/checkout/apply-coupon'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: trimmed, subtotal }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          appliedCoupon = null;
          localStorage.removeItem(COUPON_KEY);
          setCouponFeedback(data.error || 'Invalid coupon code', false);
          updateSummary();
          return;
        }
        appliedCoupon = { code: trimmed, discount: data.discount };
        localStorage.setItem(COUPON_KEY, trimmed);
        // Best one wins: if the live sale already beats this code, say so.
        if (saleDiscountFor(subtotal) >= data.discount) {
          setCouponFeedback(`Code ${trimmed} added, but your store sale saves more — we'll keep the sale price.`, true);
        } else {
          setCouponFeedback(`Code ${trimmed} applied — you save ${formatPrice(data.discount)}`, true);
        }
        updateSummary();
      } catch {
        setCouponFeedback('Could not check that code. Please try again.', false);
      }
    }

    /* Price the delivery against wherever this shopper is most likely sending it:
       the address they picked on a previous pass through checkout, else their
       default saved address. A guest, or someone with no saved address yet, has
       no destination to price — they see no delivery line until the address step
       rather than a placeholder figure we would then have to revise. */
    async function refreshDelivery() {
      DELIVERY_QUOTE = null;
      DELIVERY_FEE = null;
      const cart = getCart();
      // Nothing to ship, nothing to price — and no reason to hit the API.
      if (!cart.length) return;
      let pincode = null;
      try {
        const { isLoggedIn, getUserAddresses } = await import('/js/auth.js');
        if (isLoggedIn()) {
          const addresses = await getUserAddresses();
          const chosenId = localStorage.getItem('rangmudra_delivery_address');
          const address = addresses.find((a) => a.id === chosenId)
            || addresses.find((a) => a.default)
            || addresses[0];
          pincode = addressPincode(address);
        }
      } catch (_) {
        // Not signed in, or addresses unreachable — leave the fee unknown.
      }
      if (!pincode) return;
      const quote = await quoteDelivery(pincode, cart);
      DELIVERY_QUOTE = quote;
      DELIVERY_FEE = quote ? quote.deliveryFee : null;
    }

    function initCoupon() {
      const input = document.getElementById('coupon-input');
      const applyBtn = document.getElementById('coupon-apply');
      // Restore a previously entered code (e.g. user navigated back from checkout).
      const saved = localStorage.getItem(COUPON_KEY);
      if (saved && input) { input.value = saved; applyCoupon(saved); }
      applyBtn?.addEventListener('click', () => applyCoupon(input.value));
      input?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); applyCoupon(input.value); }
      });
      input?.addEventListener('input', () => {
        // Editing the code invalidates the applied discount until re-applied.
        if (appliedCoupon && input.value.trim().toUpperCase() !== appliedCoupon.code) clearCoupon(true);
      });
    }

    /* Every piece is one-of-a-kind — one unit of stock — and it goes out of stock
       the moment someone else's payment clears. A cart line therefore only holds
       a snapshot, so on load we re-check the catalogue and flag anything that has
       sold out (or been withdrawn) since it was added. Checkout stays blocked
       until those lines are removed; the server enforces the same rule. */
    let soldOutIds = new Set();

    async function refreshStock() {
      try {
        const cart = getCart();
        if (!cart.length) { soldOutIds = new Set(); return; }
        const products = await getProducts();
        const byId = new Map(products.map((p) => [p.id, p]));
        soldOutIds = new Set(
          cart.filter((i) => {
            const p = byId.get(i.id);
            return !p || p.available === false;
          }).map((i) => i.id)
        );
      } catch (_) {
        // Catalogue unreachable — leave the cart as-is; create-order will catch it.
        soldOutIds = new Set();
      }
    }

    function syncProceedState() {
      const empty = getCart().length === 0;
      const blocked = soldOutIds.size > 0 || empty;
      // "Amount to be paid ₹0" above a dead button helps nobody.
      const mobileBar = document.querySelector('.mobile-cta-bar');
      if (mobileBar) mobileBar.hidden = empty;
      ['proceed-btn', 'mobile-proceed-btn'].forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = blocked;
      });
      const note = document.getElementById('stock-note');
      if (note) {
        note.hidden = soldOutIds.size === 0;
        note.textContent = soldOutIds.size === 1
          ? 'One piece in your cart has sold out. Please remove it to continue.'
          : `${soldOutIds.size} pieces in your cart have sold out. Please remove them to continue.`;
      }
    }

    function renderCart() {
      const cart = getCart();
      const list = document.getElementById('cart-items-list');
      const countEl = document.getElementById('cart-item-count');

      if (countEl) {
        countEl.textContent = cart.length === 0
          ? 'Your cart is empty'
          : `You have ${cart.reduce((s, i) => s + (i.qty || 1), 0)} item${cart.reduce((s, i) => s + (i.qty || 1), 0) !== 1 ? 's' : ''} in the cart`;
      }

      if (!list) return;

      if (cart.length === 0) {
        list.innerHTML = `
          <div style="text-align:center;padding:64px 0;">
            <p class="h4-i color-sc-l3">Your cart is empty</p>
            <a href="shop.html" class="btn-primary" style="margin-top:24px;display:inline-flex;">Shop Now</a>
          </div>
        `;
        return;
      }

      list.innerHTML = cart.map(item => `
        <div class="cart-item${soldOutIds.has(item.id) ? ' cart-item--sold-out' : ''}" data-id="${item.id}" data-size="${item.size}">
          <img
            src="${item.image || '/images/uploads/prod-ajrakh-corset-1.jpg'}"
            alt="${item.name}"
            class="cart-item__image"
            loading="lazy"
            width="100" height="100"
          >
          <div class="cart-item__info">
            <p class="cart-item__category">${item.category || 'RANGMUDRA'}</p>
            <h3 class="cart-item__name">${item.name}</h3>
            ${soldOutIds.has(item.id) ? '<p class="h6-a cart-item__soldout">Sold out</p>' : ''}
          </div>
          <div class="cart-item__controls">
            <span class="cart-item__size-select" aria-label="Size: ${item.size}">${item.size}</span>
            <span class="cart-item__price">${itemPriceHTML(item, SALE)}</span>
            <button class="cart-item__delete" data-id="${item.id}" data-size="${item.size}" aria-label="Remove ${item.name}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.cart-item__delete').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(btn.dataset.id, btn.dataset.size);
          renderCart();
          updateSummary();
        });
      });

    }

    function initProceed() {
      const btn = document.getElementById('proceed-btn');
      const mobileBtn = document.getElementById('mobile-proceed-btn');
      /* Sign-in happens here, before the address step — so the address page
         opens with the shopper's saved addresses already available. */
      const go = async () => {
        if (getCart().length === 0 || soldOutIds.size > 0) return;
        const { requireAuth } = await import('/js/auth.js');
        requireAuth({ onSuccess: () => { window.location.href = 'checkout-address.html'; } });
      };
      btn?.addEventListener('click', go);
      mobileBtn?.addEventListener('click', go);
    }

    window.addEventListener('cart-updated', () => {
      renderCart();
      syncProceedState();
      // A changed cart changes the parcel weight, and so the Speed Post slab.
      refreshDelivery().then(() => {
        // Re-validate the coupon against the new subtotal (min-order / cap may shift).
        if (appliedCoupon) applyCoupon(appliedCoupon.code); else updateSummary();
      });
    });

    async function init() {
      SALE = await getSale();
      renderCart();
      updateSummary();
      // Settle the empty/blocked state on first paint, not only after the
      // stock re-check — otherwise an empty cart flashes a live CTA bar.
      syncProceedState();
      initProceed();
      initCoupon();
      await refreshStock();
      renderCart();
      syncProceedState();
      await refreshDelivery();
      updateSummary();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
