<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Gallery — Rangmudra</title>
  <meta name="description" content="A curated gallery of Rangmudra's hand block-printed and eco-printed designs — sarees, dupattas, apparel, and home décor crafted with natural dyes and wooden blocks.">
  <link rel="canonical" href="https://rangmudra.com/gallery">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Design Gallery — Rangmudra">
  <meta property="og:description" content="A curated gallery of Rangmudra's hand block-printed and eco-printed designs.">
  <link rel="icon" href="/images/logo/rangmudra-logo-32.png" sizes="32x32">
  <link rel="icon" href="/images/logo/rangmudra-logo-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/images/logo/rangmudra-logo-180.png">
  <link rel="preload" href="/fonts/maiandra-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Design Gallery — Rangmudra",
    "description": "A curated gallery of Rangmudra's hand block-printed and eco-printed designs.",
    "url": "https://rangmudra.com/gallery"
  }
  </script>
</head>
<body style="background:var(--pr-l5);">

  <div data-partial="header"></div>

  <div class="breadcrumb-wrap"><nav data-breadcrumb></nav></div>

  <main>

    <!-- Hero -->
    <section class="workshops-hero" aria-label="Design gallery hero" style="min-height:360px;">
      <img
        src="/images/uploads/home-gallery.jpg"
        alt="Hand block-printed fabrics arranged in the Rangmudra studio"
        class="workshops-hero__bg"
        loading="eager"
        fetchpriority="high"
        width="1440" height="480"
      >
      <div class="workshops-hero__overlay" aria-hidden="true"></div>

      <a href="index.html" class="btn-ghost" style="position:absolute;top:24px;left:48px;z-index:3;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>

      <div class="workshops-hero__content">
        <p class="h6-a" style="text-transform:uppercase;color:var(--pr-l5);margin-bottom:16px;letter-spacing:0.15em;">THE GALLERY</p>
        <h1 class="h2-i" style="color:var(--pr-l5);font-size:clamp(40px,5vw,72px);line-height:1.1;">Colour of the Hand</h1>
        <p class="h5-a" style="color:var(--pr-l5);opacity:0.85;max-width:560px;margin:24px auto 0;text-align:center;">Every piece hand-printed on natural fabrics with wooden blocks and plant-based dyes. Explore the studio's designs.</p>
      </div>
    </section>

    <!-- Toolbar: search + tags -->
    <section style="background:var(--pr-l5);padding:48px 0 0;">
      <div class="container">
        <div class="gallery-toolbar">
          <input
            type="search"
            class="gallery-search"
            id="gallery-search"
            placeholder="Search the gallery — indigo, saree, ajrakh..."
            aria-label="Search the design gallery"
          >
          <p class="h6-a gallery-count" id="gallery-count" aria-live="polite"></p>
        </div>
        <div class="gallery-tags" id="gallery-tags" role="group" aria-label="Filter by tag">
          <!-- Tag chips injected by gallery.js -->
        </div>
      </div>
    </section>

    <!-- Masonry -->
    <section class="section" style="padding-top:8px;">
      <div class="container">
        <div class="gallery-masonry" id="gallery-grid" aria-live="polite">
          <!-- Tiles injected by gallery.js -->
        </div>
        <div id="gallery-empty" class="gallery-empty" hidden>
          <p class="h5-a color-sc-l3">No designs match your search yet. Try a different keyword or tag.</p>
        </div>
        <div class="gallery-loadmore-wrap" id="gallery-loadmore-wrap" hidden>
          <button class="btn-primary pill" id="gallery-loadmore" style="height:52px;padding-inline:40px;">Load more</button>
        </div>
      </div>
    </section>

  </main>

  <div data-partial="footer"></div>
  <div data-partial="auth-modal"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/gallery.js"></script>

</body>
</html>
