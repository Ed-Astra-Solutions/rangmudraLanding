<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Collection — Rangmudra</title>
  <meta name="description" content="Each piece hand-printed on natural fabrics with wooden blocks and plant-based dyes.">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <link rel="canonical" href="https://rangmudra.com/shop.html">
  <meta name="theme-color" content="#2C1A10">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rangmudra">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="The Collection — Rangmudra">
  <meta property="og:description" content="Hand block-printed and eco-printed apparel, sarees, dupattas and home décor, made on natural fabrics with plant-based dyes.">
  <meta property="og:url" content="https://rangmudra.com/shop.html">
  <meta property="og:image" content="https://rangmudra.com/images/uploads/wshop-corporate-block.jpg">
  <meta property="og:image:alt" content="The Collection — Rangmudra">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Collection — Rangmudra">
  <meta name="twitter:description" content="Hand block-printed and eco-printed apparel, sarees, dupattas and home décor, made on natural fabrics with plant-based dyes.">
  <meta name="twitter:image" content="https://rangmudra.com/images/uploads/wshop-corporate-block.jpg">
  <link rel="icon" href="/images/logo/rangmudra-logo-32.png" sizes="32x32">
  <link rel="icon" href="/images/logo/rangmudra-logo-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/images/logo/rangmudra-logo-180.png">
  <link rel="preload" href="/fonts/maiandra-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body style="background:var(--pr-l5);">

  <div data-partial="header"></div>

  <div class="breadcrumb-wrap"><nav data-breadcrumb></nav></div>

  <main>

    <!-- Hero -->
    <section class="shop-hero" aria-label="Shop hero">
      <img
        data-section="shop.hero"
        src="/images/uploads/wshop-corporate-block.jpg"
        alt="Row of hand block-printed fabrics hanging in warm natural light"
        class="shop-hero__bg"
        loading="eager"
        fetchpriority="high"
        width="1440" height="560"
      >
      <div class="shop-hero__overlay" aria-hidden="true"></div>

      <a href="index.html" class="btn-ghost" style="position:absolute;top:24px;left:48px;z-index:3;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>

      <div class="shop-hero__content">
        <p class="shop-hero__eyebrow">HANDCRAFTED WITH LOVE</p>
        <h1 class="shop-hero__title">The Collection</h1>
        <p class="shop-hero__subtitle">Each piece hand-printed on natural fabrics with wooden blocks and plant-based dyes.</p>
      </div>
    </section>

    <!-- Shop catalogue -->
    <section class="section" style="padding-top:48px;">
      <div class="container">

        <!-- Search -->
        <div class="shop-search-wrap">
          <svg class="shop-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input
            type="search"
            class="shop-search"
            id="product-search"
            placeholder="Search the collection..."
            aria-label="Search products"
            autocomplete="off"
          >
        </div>

        <!-- Print-type tabs — primary categories -->
        <div class="filter-pills shop-print-tabs" id="print-tabs" role="group" aria-label="Print type" style="margin-bottom:24px;">
          <button class="filter-pill active" data-print="all">ALL</button>
          <button class="filter-pill" data-print="block">BLOCK PRINTING</button>
          <button class="filter-pill" data-print="eco">ECO PRINTING</button>
        </div>

        <!-- Filter toolbar -->
        <div class="shop-toolbar" role="toolbar" aria-label="Filter and sort products">
          <div class="filter-pills" id="category-pills" role="group" aria-label="Product categories">
            <button class="filter-pill active" data-filter="all">ALL</button>
            <button class="filter-pill" data-filter="mens">MEN'S WEAR</button>
            <button class="filter-pill" data-filter="womens">WOMEN'S WEAR</button>
            <button class="filter-pill" data-filter="decor">HOME DECOR</button>
            <button class="filter-pill" data-filter="accessories">ACCESSORIES</button>
          </div>

          <div class="shop-toolbar__dropdowns">
            <div class="dropdown" id="sort-dropdown">
              <button class="dropdown__trigger">
                <span data-label>Featured</span>
                <svg class="dropdown__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="dropdown__menu" role="listbox">
                <div class="dropdown__option active" data-value="featured">Featured</div>
                <div class="dropdown__option" data-value="price-asc">Price: Low to High</div>
                <div class="dropdown__option" data-value="price-desc">Price: High to Low</div>
              </div>
            </div>
          </div>
        </div>

        <p class="shop-result-count" id="result-count">52+ Products</p>

        <!-- Product grid -->
        <div class="shop-grid" id="product-grid" aria-label="Products">
          <!-- Populated by JS -->
        </div>

        <!-- Pagination — rendered by JS from the server's page metadata -->
        <nav class="pagination" id="pagination" style="margin-top:64px;" aria-label="Product pages" hidden></nav>

      </div>
    </section>

  </main>

  <div data-partial="footer"></div>
  <div data-partial="auth-modal"></div>

  <script type="module" src="/js/components.js"></script>
  <script type="module" src="/js/sections.js"></script>
  <script type="module">
    import { initDropdowns } from '/js/dropdown.js';
    import { initFilterPills } from '/js/filter-pills.js';
    import { isInWishlist, toggleWishlist } from '/js/wishlist.js';
    import { isInCart, addToCart } from '/js/cart.js';
    import { getProductsPage } from '/js/data.js';
    import { getSale, itemPriceHTML, productDiscount } from '/js/sale.js';
    import { primaryImage } from '/js/media.js';

    const SALE = await getSale();
    const PAGE_SIZE = 12;
    /* The products on screen right now — the wishlist buttons look up here
       instead of a full catalogue, since we only ever hold one page. */
    let pageItems = [];

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = products.map(p => `
        <a href="product.html?slug=${p.slug}" class="shop-card${p.available === false ? ' shop-card--sold-out' : ''}" data-product-id="${p.id}">
          <div class="shop-card__img-wrap">
            <img
              src="${primaryImage(p)}"
              alt="${p.name} — ${p.description}"
              class="shop-card__image"
              loading="lazy"
              width="400" height="500"
              onerror="this.src='/images/uploads/prod-ajrakh-corset-1.jpg'"
            >
            ${p.available === false ? `<span class="shop-card__soldout">Sold out</span>` : ''}
            ${p.featured ? `<span class="shop-card__featured">Featured</span>` : ''}
            ${(() => { const d = productDiscount(p); return d ? `<span class="shop-card__sale-tag">${d.type === 'flat' ? `₹${d.value} OFF` : `${d.value}% OFF`}</span>` : (SALE.live ? `<span class="shop-card__sale-tag">${SALE.percent}% OFF</span>` : ''); })()}
            <button
              class="shop-card__wishlist ${isInWishlist(p.id) ? 'active' : ''}"
              data-id="${p.id}"
              aria-label="${isInWishlist(p.id) ? 'Remove from wishlist' : 'Add to wishlist'}"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${isInWishlist(p.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            </button>
          </div>
          <div class="shop-card__info">
            <p class="shop-card__category">${p.tags.join(' · ')}</p>
            <h2 class="shop-card__name">${p.name}</h2>
            <p class="shop-card__price">${itemPriceHTML(p, SALE)}</p>
          </div>
        </a>
      `).join('');

      /* Wishlist buttons */
      grid.querySelectorAll('.shop-card__wishlist').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.id;
          const product = pageItems.find(p => p.id === id);
          if (!product) return;
          const added = toggleWishlist({ id: product.id, name: product.name, price: product.price, image: primaryImage(product), discount: product.discount || null });
          btn.classList.toggle('active', added);
          btn.setAttribute('aria-label', added ? 'Remove from wishlist' : 'Add to wishlist');
          const icon = btn.querySelector('path');
          if (icon) icon.setAttribute('fill', added ? 'currentColor' : 'none');
        });
      });
    }

    const urlParams = new URLSearchParams(location.search);
    let activeCategory = urlParams.get('category') || 'all';
    let activePrintType = urlParams.get('print') || 'all';
    let activeSort = urlParams.get('sort') || 'featured';
    let activeSearch = urlParams.get('q') || '';
    let activePage = Math.max(parseInt(urlParams.get('page'), 10) || 1, 1);

    function syncURL() {
      const next = new URLSearchParams();
      if (activePrintType !== 'all') next.set('print', activePrintType);
      if (activeCategory !== 'all') next.set('category', activeCategory);
      if (activeSearch.trim()) next.set('q', activeSearch.trim());
      if (activeSort !== 'featured') next.set('sort', activeSort);
      if (activePage > 1) next.set('page', String(activePage));
      const qs = next.toString();
      const newURL = qs ? `${location.pathname}?${qs}` : location.pathname;
      history.replaceState(null, '', newURL);
      /* Refresh the breadcrumb to reflect the new filter state */
      import('/js/breadcrumbs.js').then(m => m.initBreadcrumbs());
    }

    function setActivePill(container, attr, value) {
      container?.querySelectorAll('.filter-pill').forEach(p => {
        p.classList.toggle('active', p.dataset[attr] === value);
      });
    }

    const pagination = document.getElementById('pagination');
    const grid = document.getElementById('product-grid');
    const count = document.getElementById('result-count');

    /* The page numbers to show: always first + last, plus a window around the
       current page, with … standing in for the gaps. */
    function pageWindow(current, pages) {
      const nums = new Set([1, pages, current, current - 1, current + 1]);
      const list = [...nums].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
      const out = [];
      list.forEach((n, i) => {
        if (i && n - list[i - 1] > 1) out.push('…');
        out.push(n);
      });
      return out;
    }

    function renderPagination({ page, pages, total }) {
      /* One page of results needs no pager — this is what used to render as a
         hardcoded 1..6 regardless of how many products existed. */
      if (pages <= 1) { pagination.hidden = true; pagination.innerHTML = ''; return; }
      pagination.hidden = false;
      pagination.innerHTML = `
        <button class="pagination__btn prev-next" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">← Previous</button>
        <span class="pagination__mobile" aria-hidden="true">${page} / ${pages}</span>
        ${pageWindow(page, pages).map(n => n === '…'
          ? `<span class="pagination__gap" aria-hidden="true">…</span>`
          : `<button class="pagination__btn${n === page ? ' active' : ''}" data-page="${n}" ${n === page ? 'aria-current="page"' : ''} aria-label="Page ${n}">${n}</button>`
        ).join('')}
        <button class="pagination__btn prev-next" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="Next page">Next →</button>
      `;
      pagination.setAttribute('aria-label', `Product pages, page ${page} of ${pages} (${total} products)`);
    }

    let requestSeq = 0;

    async function updateGrid({ scroll = false } = {}) {
      const seq = ++requestSeq;
      grid.setAttribute('aria-busy', 'true');
      let data;
      try {
        data = await getProductsPage({
          q: activeSearch, category: activeCategory, print: activePrintType,
          sort: activeSort, page: activePage, pageSize: PAGE_SIZE,
        });
      } catch (_) {
        if (seq !== requestSeq) return;
        grid.setAttribute('aria-busy', 'false');
        grid.innerHTML = `<p class="h5-a color-sc-l3" style="grid-column:1/-1;padding:48px 0;">We couldn't load the collection just now. Please refresh to try again.</p>`;
        pagination.hidden = true;
        return;
      }
      /* A slower earlier request must not overwrite a newer one's results. */
      if (seq !== requestSeq) return;
      grid.setAttribute('aria-busy', 'false');

      pageItems = data.items;
      /* The server clamps the page when filters shrink the result set. */
      activePage = data.page;

      if (!data.total) {
        grid.innerHTML = `<p class="h5-a color-sc-l3" style="grid-column:1/-1;padding:48px 0;">No products match your search${activeSearch.trim() ? ` for “${activeSearch.trim()}”` : ''}.</p>`;
      } else {
        renderProducts(data.items);
      }
      renderPagination(data);

      if (count) {
        const shownFrom = (data.page - 1) * data.pageSize + 1;
        const shownTo = shownFrom + data.items.length - 1;
        count.textContent = !data.total
          ? 'No products'
          : data.pages > 1
            ? `Showing ${shownFrom}–${shownTo} of ${data.total} Products`
            : `${data.total} ${data.total === 1 ? 'Product' : 'Products'}`;
      }

      if (scroll) {
        document.querySelector('.shop-toolbar')?.scrollIntoView({
          behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
          block: 'start',
        });
      }
    }

    /* Any filter/search/sort change invalidates the current page number. */
    function resetToFirstPage() { activePage = 1; }

    /* Pre-activate pills + search box from URL params */
    setActivePill(document.getElementById('print-tabs'), 'print', activePrintType);
    setActivePill(document.getElementById('category-pills'), 'filter', activeCategory);
    const searchInput = document.getElementById('product-search');
    if (searchInput) searchInput.value = activeSearch;
    /* Reflect a sort carried in on the URL in the dropdown's label */
    const sortDropdown = document.getElementById('sort-dropdown');
    if (activeSort !== 'featured') {
      const opt = sortDropdown?.querySelector(`.dropdown__option[data-value="${activeSort}"]`);
      if (opt) {
        sortDropdown.querySelectorAll('.dropdown__option').forEach(o => o.classList.toggle('active', o === opt));
        const label = sortDropdown.querySelector('[data-label]');
        if (label) label.textContent = opt.textContent;
      } else {
        activeSort = 'featured';
      }
    }
    updateGrid();
    initDropdowns();

    pagination.addEventListener('click', (e) => {
      const btn = e.target.closest('.pagination__btn');
      if (!btn || btn.disabled) return;
      const next = parseInt(btn.dataset.page, 10);
      if (!next || next === activePage) return;
      activePage = next;
      updateGrid({ scroll: true });
      syncURL();
    });

    /* Search — debounced so we don't hit the API on every keystroke */
    let searchTimer;
    searchInput?.addEventListener('input', (e) => {
      activeSearch = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { resetToFirstPage(); updateGrid(); syncURL(); }, 250);
    });

    initFilterPills('#category-pills', (val) => {
      activeCategory = val || 'all';
      resetToFirstPage();
      updateGrid();
      syncURL();
    });

    initFilterPills('#print-tabs', (val) => {
      activePrintType = val || 'all';
      resetToFirstPage();
      updateGrid();
      syncURL();
    }, 'print');

    sortDropdown?.addEventListener('dropdown-select', (e) => {
      activeSort = e.detail.value;
      resetToFirstPage();
      updateGrid();
      syncURL();
    });
  </script>
</body>
</html>
